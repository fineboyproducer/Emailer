<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101114">
<title>Log in · Emailer</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="sb-brand" href="/login.html"><span class="sb-mark"><i data-lucide="arrow-up-right"></i></span>Emailer</a>
      <p class="tagline">Every message moves you forward.</p>
      <div class="card">
        <div id="msg" class="msg error" style="display:none;"></div>
        <form id="loginForm">
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autofocus>
          </div>
          <button type="submit" class="btn" style="width:100%;">Log in</button>
        </form>
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    refreshIcons();
    const msg = document.getElementById("msg");
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMsg(msg);
      const password = document.getElementById("password").value;
      try {
        await api("/api/auth/login", { method: "POST", body: JSON.stringify({ password }) });
        window.location.href = "/index.html";
      } catch (err) {
        showMsg(msg, err.message);
      }
    });
  </script>
</body>
</html>
