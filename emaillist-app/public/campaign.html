<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101114">
<title>Campaign Report · Emailer</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <a href="/campaigns.html" class="link-btn" style="margin-bottom:18px;"><i data-lucide="arrow-left"></i>Your campaigns</a>
    <div id="wrap"><div class="skeleton sk-block" style="height:220px"></div></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    renderNav("/campaigns.html");
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    function statusLabel(c) {
      if (c.status === "sent") return `<span class="status-pill active">Sent</span>`;
      if (c.status === "partial") return `<span class="status-pill" style="color:var(--danger)">Partial</span>`;
      return `<span class="status-pill" style="color:var(--danger)">Failed</span>`;
    }

    function statRow(label, value) {
      return `<div class="modal-row"><span class="label">${label}</span><span>${value}</span></div>`;
    }

    (async () => {
      const wrap = document.getElementById("wrap");
      if (!id) { wrap.innerHTML = emptyState({ title: "No campaign selected", body: "Pick a campaign from your list to see its report.", href: "/campaigns.html", label: "Your campaigns" }); refreshIcons(); return; }
      let report, full;
      try {
        [report, full] = await Promise.all([api(`/api/campaigns/${id}/report`), api(`/api/campaigns/${id}`)]);
      } catch (err) {
        wrap.innerHTML = `<div class="msg error">Couldn't load this report: ${escapeHtml(err.message)}</div>`;
        return;
      }
      const { campaign, counts, rates, topLinks } = report;
      const fullCampaign = full.campaign;

      wrap.innerHTML = `
        <div class="page-head"><div><h1>${escapeHtml(campaign.subject)}</h1>
        <p class="subtitle">
          Sent ${new Date(campaign.sent_at).toLocaleString()} ${statusLabel(campaign)}
          · ${campaign.segments.length ? escapeHtml(campaign.segments.map(s => s.name).join(", ")) : "All active contacts"}
        </p></div></div>

        <div class="stat-grid">
          <div class="stat card"><div class="label">Sent</div><div class="num">${formatNumber(counts.sent)}</div></div>
          <div class="stat card"><div class="label">Delivery rate</div><div class="num">${formatRate(rates.deliveryRate)}</div></div>
          <div class="stat card"><div class="label">Open rate (unique)</div><div class="num">${formatRate(rates.openRate)}</div></div>
          <div class="stat card"><div class="label">Click rate (unique)</div><div class="num">${formatRate(rates.clickRate)}</div></div>
        </div>

        <div class="card section">
          <h2>Delivery funnel</h2>
          ${(() => {
            const base = counts.sent || 0;
            const row = (name, n) => `
              <div class="funnel-row">
                <span class="name">${name}</span>
                <div class="funnel-bar"><span style="width:${base ? Math.min(100, (n / base) * 100) : 0}%"></span></div>
                <span class="val">${formatNumber(n)}</span>
              </div>`;
            return row("Sent", counts.sent) + row("Delivered", counts.delivered) + row("Opened", counts.opens_unique) + row("Clicked", counts.clicks_unique);
          })()}
          <p class="helptext">Bars show unique recipients as a share of emails sent. Opens are approximate.</p>
        </div>

        <div class="card">
          <h2>Delivery</h2>
          ${statRow("Recipients", formatNumber(counts.recipients))}
          ${statRow("Sent", formatNumber(counts.sent))}
          ${statRow("Delivered", formatNumber(counts.delivered))}
          ${statRow("Delivery rate", formatRate(rates.deliveryRate))}
          ${statRow("Delayed", formatNumber(counts.delayed))}
          ${statRow("Bounced", formatNumber(counts.bounced))}
          ${statRow("Bounce rate", formatRate(rates.bounceRate))}
          ${statRow("Failed to send", formatNumber(counts.failed))}
        </div>

        <div class="card">
          <h2>Engagement</h2>
          <p class="helptext" style="margin-top:-8px;margin-bottom:10px;">
            Open tracking is approximate — some email clients block or preload tracking pixels, so opens can be under- or over-counted. Clicks and deliveries are more reliable signals.
          </p>
          ${statRow("Opens (unique)", formatNumber(counts.opens_unique))}
          ${statRow("Opens (total)", formatNumber(counts.opens_total))}
          ${statRow("Open rate", formatRate(rates.openRate))}
          ${statRow("Clicks (unique)", formatNumber(counts.clicks_unique))}
          ${statRow("Clicks (total)", formatNumber(counts.clicks_total))}
          ${statRow("Click rate", formatRate(rates.clickRate))}
          ${statRow("Click-to-open rate", formatRate(rates.clickToOpenRate))}
        </div>

        <div class="card">
          <h2>List health</h2>
          ${statRow("Unsubscribed", formatNumber(counts.unsubscribed))}
          ${statRow("Unsubscribe rate", formatRate(rates.unsubscribeRate))}
          ${statRow("Spam complaints", formatNumber(counts.complained))}
          ${statRow("Complaint rate", formatRate(rates.complaintRate))}
        </div>

        <div class="card">
          <h2>Top clicked links</h2>
          <div id="topLinksWrap"></div>
        </div>

        <div class="card">
          <h2>Email body</h2>
          <div class="body-preview">${fullCampaign.body_html}</div>
        </div>

        <div class="action-row">
          <button class="btn btn-secondary" id="duplicateBtn"><i data-lucide="copy"></i>Duplicate campaign</button>
        </div>
      `;

      const linksWrap = document.getElementById("topLinksWrap");
      if (!topLinks.length) {
        linksWrap.innerHTML = `<div class="empty-state">No link clicks recorded yet. Clicks will appear here once recipients start following your links.</div>`;
      } else {
        linksWrap.innerHTML = `
          <table class="table-cards">
            <thead><tr><th>URL</th><th>Total clicks</th><th>Unique clicks</th></tr></thead>
            <tbody>
              ${topLinks.map(l => `
                <tr>
                  <td class="cell-title" style="word-break:break-all;"><a href="${l.link_url}" target="_blank" rel="noopener">${escapeHtml(l.link_url)}</a></td>
                  <td data-label="Total clicks" class="tnum">${formatNumber(l.total_clicks)}</td>
                  <td data-label="Unique clicks" class="tnum">${formatNumber(l.unique_clicks)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      document.getElementById("duplicateBtn").addEventListener("click", () => {
        window.location.href = `/compose.html?duplicate=${campaign.id}`;
      });
      refreshIcons();
    })();
  </script>
</body>
</html>
